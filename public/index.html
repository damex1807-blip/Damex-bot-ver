<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<title>DAMEX AUTOBOTS</title>
<style>
:root{--bg:#0a0a0c;--card:#131316;--line:#25252b;--tx:#f3f3f3;--mu:#8d8d97;--ac:#ff5a1f;--up:#2ee59d;--dn:#ff4d5e;--wa:#ffb020}
*{box-sizing:border-box}
body{margin:0;color:var(--tx);font:14px/1.45 system-ui,-apple-system,sans-serif;
background:var(--bg) repeating-linear-gradient(45deg,#0e0e11 0 4px,#0a0a0c 4px 8px);
padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 40px);max-width:560px;margin:auto}
.wm{position:fixed;inset:0;display:grid;place-items:center;font:900 24vw/1 system-ui;letter-spacing:.04em;color:#ffffff07;pointer-events:none;transform:rotate(-14deg);z-index:0}
main{position:relative;z-index:1}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.logo{font:900 20px system-ui;letter-spacing:.18em}.logo b{color:var(--ac)}
.live{font-size:11px;color:var(--mu)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.chip{flex:none;background:var(--card);border:1px solid var(--line);color:var(--tx);padding:8px 14px;border-radius:20px;font-size:13px}
.chip.on{border-color:var(--ac);color:var(--ac)}
.card{background:linear-gradient(180deg,#17171b,#111114);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.sig{display:flex;justify-content:space-between;align-items:center}
.big{font:900 34px system-ui;letter-spacing:.06em}
.BUY{color:var(--up)}.SELL{color:var(--dn)}.WAIT{color:var(--wa)}
.mu{color:var(--mu);font-size:12px}
canvas{width:100%;height:230px;display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv{background:#0d0d10;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.kv span{display:block;color:var(--mu);font-size:11px}
.p{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.p:first-of-type{border-top:0}
.tag{font-size:11px;padding:2px 8px;border-radius:10px;border:1px solid;white-space:nowrap;align-self:flex-start}
.OK{color:var(--up)}.NO_DATA{color:var(--dn)}
ul{margin:6px 0 0;padding-left:18px}
button.r{width:100%;background:var(--ac);color:#000;font-weight:800;border:0;border-radius:12px;padding:13px;letter-spacing:.1em}
</style>
</head>
<body>
<div class="wm">DAMEX</div>
<main>
<header><div class="logo">DAMEX <b>AUTOBOTS</b></div><div class="live" id="asof">–</div></header>
<div class="chips" id="chips"></div>
<div class="card">
  <div class="sig"><div><div class="mu" id="sym">–</div><div class="big WAIT" id="sig">…</div></div>
  <div style="text-align:right"><div class="mu">Confidence</div><div style="font:800 24px system-ui" id="conf">–</div></div></div>
  <ul class="mu" id="why"></ul>
</div>
<div class="card"><canvas id="cv"></canvas></div>
<div class="card"><div class="grid" id="lv"></div></div>
<div class="card" id="pil"></div>
<div class="card" id="dq"></div>
<button class="r" id="rf">REFRESH ANALYSIS</button>
<p class="mu" style="text-align:center;margin-top:14px">Analysis tool, not financial advice. Signals can be wrong.</p>
</main>
<script>
const SYMS=['BTC/USD','ETH/USD','EUR/USD','GBP/USD','XAU/USD','AAPL','TSLA'];
let cur=SYMS[0];
const $=id=>document.getElementById(id);
const fmt=v=>v==null?'–':(Math.abs(v)>=100?v.toFixed(2):v.toFixed(5));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function chips(){$('chips').innerHTML=SYMS.map(s=>`<button class="chip ${s===cur?'on':''}" data-s="${s}">${s}</button>`).join('');
  document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{cur=b.dataset.s;chips();load()})}

function chart(d){
  const cv=$('cv'),dpr=devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;
  cv.width=w*dpr;cv.height=h*dpr;const x=cv.getContext('2d');x.scale(dpr,dpr);
  const c=d.candles,st=d.setup;
  const lv=st?[st.entry,st.stop,st.tp1&&st.tp1.p,st.extended&&st.extended.p].filter(v=>v!=null):[];
  const hi=Math.max(...c.map(b=>b.h),...lv),lo=Math.min(...c.map(b=>b.l),...lv),pad=(hi-lo)*.05;
  const Y=v=>h-((v-(lo-pad))/(hi-lo+2*pad))*h,bw=w/c.length;
  c.forEach((b,i)=>{const up=b.c>=b.o,col=up?'#2ee59d':'#ff4d5e',cx=i*bw+bw/2;
    x.strokeStyle=col;x.fillStyle=col;x.beginPath();x.moveTo(cx,Y(b.h));x.lineTo(cx,Y(b.l));x.stroke();
    x.fillRect(cx-bw*.35,Math.min(Y(b.o),Y(b.c)),bw*.7,Math.max(1,Math.abs(Y(b.o)-Y(b.c))))});
  if(st){[['ENTRY',st.entry,'#ffb020'],['SL',st.stop,'#ff4d5e'],['TP1',st.tp1&&st.tp1.p,'#2ee59d'],['EXT',st.extended&&st.extended.p,'#6ea8ff']].forEach(([n,v,col])=>{
    if(v==null)return;x.strokeStyle=col;x.setLineDash([5,4]);x.beginPath();x.moveTo(0,Y(v));x.lineTo(w,Y(v));x.stroke();x.setLineDash([]);
    x.fillStyle=col;x.font='11px system-ui';x.fillText(n,4,Y(v)-3)})}
}

function render(d){
  $('sym').textContent=d.symbol+' · '+fmt(d.price);
  const s=$('sig');s.textContent=d.signal;s.className='big '+d.signal;
  $('conf').textContent=d.confidence+'%';
  $('why').innerHTML=d.reasons.length?d.reasons.map(r=>`<li>${esc(r)}</li>`).join(''):'<li>All checks passed</li>';
  $('asof').textContent=d.asOf+' · '+d.ageMin+'m old';
  const st=d.setup,kv=(k,v)=>`<div class="kv"><span>${k}</span>${v}</div>`;
  $('lv').innerHTML=st?kv('Side',st.side)+kv('Entry (limit)',fmt(st.entry))+kv('Stop loss',fmt(st.stop))+
    kv('TP1 · net RR',st.tp1?fmt(st.tp1.p)+' · 1:'+st.tp1.rr:'none ≥ 1:2')+
    kv('Extended target',st.extended?fmt(st.extended.p)+' · 1:'+st.extended.rr:'no structure')+kv('Cost assumed',(d.costAssumption*100).toFixed(2)+'%')
    :'<div class="mu" style="grid-column:1/-1">No qualifying setup right now.</div>';
  $('pil').innerHTML='<div class="mu" style="margin-bottom:4px">THREE PILLARS</div>'+Object.entries(d.pillars).map(([k,v])=>
    `<div class="p"><div><b style="text-transform:capitalize">${k}</b><div class="mu">${esc(v.note)}</div></div><span class="tag ${v.status}">${v.status.replace('_',' ')}</span></div>`).join('');
  $('dq').innerHTML='<div class="mu">DATA QUALITY</div>'+(d.quality.length?'<ul>'+d.quality.map(q=>`<li>${esc(q)}</li>`).join('')+'</ul>':'<div class="mu">Provider response, symbol and freshness verified.</div>');
  chart(d);
}

async function load(){
  $('sig').textContent='…';$('sig').className='big WAIT';
  try{const r=await fetch('/api/analyze?symbol='+encodeURIComponent(cur));const d=await r.json();
    if(d.error)throw new Error(d.error);render(d)}
  catch(e){$('sym').textContent=cur;$('sig').textContent='NO DATA';$('why').innerHTML=`<li>${esc(e.message)}</li>`;$('conf').textContent='–'}
}
$('rf').onclick=load;chips();load();
</script>
</body>
  </html>
